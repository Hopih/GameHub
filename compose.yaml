services:
  qdrant:
    image: qdrant/qdrant:v1.20.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333;
          printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3;
          read -r status <&3;
          [[ "$$status" == HTTP/*" 200 "* ]]
      interval: 10s
      timeout: 3s
      retries: 5

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command:
      - --model-id
      - intfloat/multilingual-e5-small
      - --revision
      - fd1525a9fd15316a2d503bf26ab031a61d056e98
      - --pooling
      - mean
    restart: unless-stopped
    ports:
      - "127.0.0.1:${EMBEDDINGS_PORT:-18081}:80"
    volumes:
      - embeddings_cache:/data
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, http://127.0.0.1/health]
      interval: 10s
      timeout: 3s
      start_period: 10m
      retries: 12

volumes:
  qdrant_data:
  embeddings_cache:
