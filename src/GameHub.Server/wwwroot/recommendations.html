<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111314">
    <meta name="description" content="Открывай новые игры, собирай свою библиотеку и находи новые игровые миры с GameHub.">
    <title>Рекомендованные игры — GameHub</title>
    <link rel="stylesheet" href="/css/main.css">
    <script type="module" src="/js/main.js"></script>
</head>
<body>
    <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="7.3"/><path d="m16.2 16.2 4.6 4.6"/></symbol>
        <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
        <symbol id="icon-heart" viewBox="0 0 24 24"><path d="M20.4 4.9a5.3 5.3 0 0 0-7.5 0L12 5.8l-.9-.9a5.3 5.3 0 0 0-7.5 7.5L12 21l8.4-8.6a5.3 5.3 0 0 0 0-7.5Z"/></symbol>
        <symbol id="icon-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.3.9-4.6 4.5 1.1 6.3-5.6-3-5.6 3 1.1-6.3L3 9.6l6.3-.9Z"/></symbol>
        <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
        <symbol id="icon-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    </svg>

    <a class="skip-link" href="#main-content">Перейти к содержанию</a>

    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="/" aria-label="GameHub — главная">Game<span>Hub</span></a>
            <nav class="main-nav" aria-label="Основная навигация">
                <a href="/#catalog" data-nav="catalog">Каталог</a>
                <a href="/recommendations" data-nav="recommendations" class="is-active" aria-current="page">Для тебя</a>
                <a href="/library" data-nav="library">Избранное<span id="saved-count" class="saved-count" hidden>0</span></a>
                <a href="/#news" data-nav="news">Новости</a>
            </nav>
            <form id="search-form" class="search-form" role="search" action="/#catalog" method="get">
                <svg class="icon" aria-hidden="true"><use href="#icon-search"/></svg>
                <input id="game-search" type="search" name="q" placeholder="Найти игру" aria-label="Найти игру в каталоге" autocomplete="off">
                <kbd aria-hidden="true">/</kbd>
            </form>
            <div class="account-actions">
                <button id="account-entry" class="account-entry" type="button">Войти</button>
                <button id="account-logout" class="account-logout" type="button" hidden>Выйти</button>
            </div>
        </div>
    </header>

    <main id="main-content" data-current-page="recommendations" tabindex="-1">
        <div class="page-container">
            <section class="section standalone-page" aria-labelledby="recommended-title">
                <div class="section-heading">
                    <h1 id="recommended-title">Рекомендованные игры</h1>
                    <a class="text-link" href="/#catalog" data-nav="catalog">Открыть каталог<svg class="icon" aria-hidden="true"><use href="#icon-arrow"/></svg></a>
                </div>
                <form id="recommendation-form" class="recommendation-form">
                    <label for="recommendation-description">Какую игру ищешь?</label>
                    <textarea id="recommendation-description" rows="3" maxlength="1000" required
                              placeholder="Например, хочу строить заводы и прокладывать конвейеры"></textarea>
                    <div class="recommendation-actions">
                        <button class="button button-primary" type="submit">Подобрать игры</button>
                        <button id="reset-recommendations" class="button button-secondary" type="button" hidden>Сбросить</button>
                    </div>
                </form>
                <p id="recommended-status" class="section-note" role="status">Загружаем игры из каталога…</p>
                <div id="recommended-games" class="game-grid" aria-busy="true"></div>
                <button id="retry-recommendations" class="button button-secondary" type="button" hidden>Попробовать снова</button>
            </section>
        </div>
    </main>

    <footer class="site-footer"><div class="footer-inner"><a class="brand footer-brand" href="/">Game<span>Hub</span></a><p>Твоя следующая любимая игра — где-то рядом.</p><a href="https://rawg.io/" target="_blank" rel="noopener noreferrer">Данные об играх — RAWG<svg class="icon" aria-hidden="true"><use href="#icon-arrow"/></svg></a></div></footer>
    <dialog id="account-dialog" class="account-dialog" aria-labelledby="account-title">
        <div class="account-dialog-header">
            <h2 id="account-title">Вход в GameHub</h2>
            <button id="account-close" type="button" aria-label="Закрыть">×</button>
        </div>
        <p id="account-error" class="account-error" role="alert"></p>
        <form id="account-login" class="account-form" action="/login" method="post">
            <label>Email<input type="email" name="email" autocomplete="username" maxlength="120" required></label>
            <label>Пароль<input type="password" name="password" autocomplete="current-password" required></label>
            <button class="button button-primary" type="submit">Войти</button>
        </form>
        <form id="account-register" class="account-form" action="/register" method="post" hidden>
            <label>Ник<input type="text" name="nickname" autocomplete="nickname" maxlength="120" required></label>
            <label>Email<input type="email" name="email" autocomplete="username" maxlength="120" required></label>
            <label>Пароль<input type="password" name="password" autocomplete="new-password" required></label>
            <button class="button button-primary" type="submit">Зарегистрироваться</button>
        </form>
        <button id="account-switch" class="text-link account-switch" type="button">Создать аккаунт</button>
    </dialog>
    <div id="notification" class="notification" role="status" aria-live="polite"></div>
</body>
</html>
